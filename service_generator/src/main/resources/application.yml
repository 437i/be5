server:
  port: 8080

spring:
  application:
    name: service_generator
  datasource:
    url: jdbc:postgresql://localhost:5432/online_store_db
    username: tamicacr
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    properties:
      spring.json.add.type.headers: false   # не добавлять __TypeId__ в заголовки
  task:
    scheduling:
      pool:
        size: 2 # чтобы таймер не блокировал другие задачи, если они появятся