spring:
  application:
    name: service_generator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:online_store_db}
    username: ${DB_USER:tamicacr}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false} # true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      Jackson 2 serializer не работает в Spring Boot 4
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    properties:
      spring.json.add.type.headers: false   # не добавлять __TypeId__ в заголовки
  task:
    scheduling:
      pool:
        size: 2 # чтобы таймер не блокировал другие задачи, если они появятся
generator:
  interval-ms: ${EVENT_INTERVAL_MS:10000}
  topic: ${KAFKA_TOPIC:product.events}