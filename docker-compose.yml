services:
  postgres:
    image: postgres:18
    container_name: be5-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - be5

  migrate:
    build:
      context: ./api
      target: migrate
    container_name: be5-migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
      GOOSE_MIGRATION_DIR: /app/migrations
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - be5

  db-init:
    image: postgres:18
    container_name: be5-db-init
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_RO_USER: ${POSTGRES_RO_USER}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}
    volumes:
      - ./postgres/readonly.sh:/usr/local/bin/readonly.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/readonly.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - be5

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: be5-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@be5.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: /admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - be5

  api:
    build: 
      context: ./api
      target: runtime
    container_name: be5-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
      AUTH_GRPC_HOST: auth
      AUTH_GRPC_PORT: "50051"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: product.events
      KAFKA_GROUP_ID: gateway-api
      CONSUMER_ENABLED: "true"
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/swagger/index.html || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - be5

  api-ro-1:
    build:
      context: ./api
      target: runtime
    container_name: be5-api-ro-1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_RO_USER}
      DB_PASSWORD: ${POSTGRES_RO_PASSWORD}
      PORT: "8081"
      AUTH_GRPC_HOST: auth
      AUTH_GRPC_PORT: "50051"
      CONSUMER_ENABLED: "false"
      REDIS_ADDR: redis:6379
    ports:
      - "8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/swagger/index.html || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - be5
    
  api-ro-2:
    build:
      context: ./api
      target: runtime
    container_name: be5-api-ro-2
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_RO_USER}
      DB_PASSWORD: ${POSTGRES_RO_PASSWORD}
      PORT: "8082"
      AUTH_GRPC_HOST: auth
      AUTH_GRPC_PORT: "50051"
      CONSUMER_ENABLED: "false"
      REDIS_ADDR: redis:6379
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8082/swagger/index.html || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - be5

  nginx:
    image: nginx:alpine
    container_name: be5-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      api:
        condition: service_healthy
      api-ro-1:
        condition: service_healthy
      api-ro-2:
        condition: service_healthy
      pgadmin:
        condition: service_started
    restart: unless-stopped
    networks:
      - be5

  auth-postgres:
    image: postgres:18
    container_name: be5-auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - be5

  auth:
    build:
      context: .
      dockerfile: service_auth/Dockerfile
      target: runtime
    container_name: be5-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${AUTH_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      GRPC_SERVER_PORT: "50051"
    # ports:
    #   - "127.0.0.1:50051:50051"
    expose:
      - "50051"
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50051' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - be5

  kafka:
    image: apache/kafka:3.9.0
    container_name: be5-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - be5

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: be5-kafka-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic product.events --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - be5

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: be5-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: be5
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - be5

  redis:
    image: redis:7-alpine
    container_name: be5-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - be5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: be5-redisinsight
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: be5-cache
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - be5

networks:
  be5:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  nginx_cache:
  auth_postgres_data:
  redisinsight_data:
